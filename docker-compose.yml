version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: local-coder-ollama
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    command: serve

  model-puller:
    image: ollama/ollama:latest
    container_name: local-coder-model-puller
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: /bin/sh
    command: >
      -c "
        echo 'Waiting for Ollama...' &&
        sleep 10 &&
        echo 'Pulling qwen2.5-coder:3b model...' &&
        ollama pull qwen2.5-coder:3b &&
        echo 'Done!' &&
        exit 0
      "
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: localdocs-generator
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_AI_OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
      model-puller:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  ollama_data: